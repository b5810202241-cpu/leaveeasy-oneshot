<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/firebase-init.js"></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>LeaveEasy ระบบขอลาออนไลน์</h1>
    <p class="subtitle">เข้าสู่ระบบเพื่อจัดการใบขอลา</p>

    <div class="card" style="max-width: 400px; margin: 40px auto;">
      <h2>เข้าสู่ระบบ</h2>

      <form id="ฟอร์มเข้า">
        <label for="อีเมล">อีเมล</label>
        <input type="email" id="อีเมล" name="email" required placeholder="ตัวอย่าง: somchai@example.com">

        <label for="รหัสผ่าน" style="margin-top: 16px;">รหัสผ่าน</label>
        <input type="password" id="รหัสผ่าน" name="password" required placeholder="ใส่รหัสผ่านของคุณ">

        <div id="เตือนข้อผิดพลาด" class="alert alert-error hidden" style="margin-top: 16px;"></div>

        <div class="btn-row" style="margin-top: 24px;">
          <button type="submit" class="btn">เข้าสู่ระบบ</button>
        </div>
      </form>

      <div style="margin-top: 18px; text-align: center; color: #667380;">
        <p>ยังไม่มีบัญชี? <a href="signup.html" style="color: #1f5f8b; text-decoration: none; font-weight: 700;">สมัครสมาชิก</a></p>
      </div>
    </div>
  </div>
</body>
</html>
